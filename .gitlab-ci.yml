# Speed up pip installs by caching
variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  # Required for mkdocs-git-revision-date-localized-plugin to have access to git history
  GIT_DEPTH: 0
  GOPATH: "$CI_PROJECT_DIR/.cache/go"
  # Pinned linter versions (kept in lockstep across modules).
  STATICCHECK_VERSION: "2025.1.1"
  GOSEC_VERSION: "v2.22.4"

stages:
  - test
  - deploy

# Build, vet and test every Go module in the repo (core, components/*,
# observability/*, examples). Each directory containing a go.mod is an
# independent module and is validated on its own. A per-module coverage
# profile is written under .coverage/ and aggregated by the coverage job.
go:
  stage: test
  image: golang:1.25
  cache:
    key: go-mod
    paths:
      - .cache/go/pkg/mod
  script:
    - |
      set -e
      mkdir -p .coverage
      for mod in $(find . -name go.mod -not -path '*/.*'); do
        dir=$(dirname "$mod")
        echo "== $dir =="
        # Replace path-unsafe characters in the profile name (e.g. components/redis -> components-redis)
        profile_name=$(echo "$dir" | tr '/' '-')
        (cd "$dir" && go build ./... && go vet ./... && go test -coverprofile="../../.coverage/${profile_name}.out" ./...)
      done
  artifacts:
    when: always
    paths:
      - .coverage/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# Aggregate the per-module coverage profiles produced by the `go` job and
# print a human-readable total. This does not gate the pipeline (no coverage
# threshold is enforced yet) but makes coverage visible in the job log and
# exposes the merged profile as an artifact.
coverage:
  stage: test
  image: golang:1.25
  needs:
    - go
  script:
    - |
      set -e
      # Merge all per-module profiles, stripping the per-module mode header so
      # `go tool cover -func` can consume them as one.
      merged=.coverage/merged.out
      : > "$merged"
      for f in .coverage/*.out; do
        [ "$f" = "$merged" ] && continue
        # Drop the leading "mode:" line from every profile except the first.
        if [ -s "$merged" ]; then
          tail -n +2 "$f" >> "$merged"
        else
          cat "$f" > "$merged"
        fi
      done
      echo "== Coverage =="
      go tool cover -func "$merged" | tail -1
  artifacts:
    when: always
    paths:
      - .coverage/merged.out
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# Run staticcheck and gosec on every module. staticcheck is the de-facto Go
# static analyzer (surfaces dead code, simplifications, correctness bugs);
# gosec flags insecure patterns (weak crypto, hardcoded creds, SQL
# injection). Both are installed via `go install` from pinned versions so the
# job is reproducible and needs no pre-baked image.
lint:
  stage: test
  image: golang:1.25
  cache:
    key: lint-tools
    paths:
      - .cache/go/bin
      - .cache/go/pkg/mod
  script:
    - |
      set -e
      export PATH="$GOPATH/bin:$PATH"
      # Install the linters once (cached across runs via .cache/go/bin).
      if ! command -v staticcheck >/dev/null 2>&1; then
        go install "honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}"
      fi
      if ! command -v gosec >/dev/null 2>&1; then
        go install "github.com/securego/gosec/v2/cmd/gosec@${GOSEC_VERSION}"
      fi
      for mod in $(find . -name go.mod -not -path '*/.*'); do
        dir=$(dirname "$mod")
        echo "== staticcheck $dir =="
        (cd "$dir" && staticcheck ./...)
        echo "== gosec $dir =="
        # gosec excludes the test files (which legitimately use weak patterns
        # like math/rand or fixed test secrets) and the generated examples.
        (cd "$dir" && gosec -exclude-dir=_test -severity medium ./...)
      done
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

pages:
  stage: deploy
  image: python:3.12-slim
  cache:
    paths:
      - .cache/pip
  script:
    - pip install -r requirements.txt
    - mkdocs build
    - mkdocs build -f mkdocs.fr.yml
    - mv site public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "master"

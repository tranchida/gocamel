# Variables for Go CI pipeline.
variables:
  GOPATH: "$CI_PROJECT_DIR/.cache/go"
  # Pinned linter versions (kept in lockstep across modules).
  STATICCHECK_VERSION: "2026.2.1"
  GOSEC_VERSION: "v2.29.0"

stages:
  - test
  - deploy

# Build, vet and test every Go module in the repo (core, components/*,
# observability/*, examples). Each directory containing a go.mod is an
# independent module and is validated on its own. A per-module coverage
# profile is written under .coverage/ and aggregated by the coverage job.
go:
  stage: test
  image: golang:1.27
  cache:
    key: go-mod-go1.27
    paths:
      - .cache/go/pkg/mod
  script:
    - |
      set -e
      mkdir -p .coverage
      covdir="$CI_PROJECT_DIR/.coverage"
      for mod in $(find . -name go.mod -not -path '*/.*' -not -path './hugo-site/*'); do
        dir=$(dirname "$mod")
        echo "== $dir =="
        # Build a path-safe profile name: drop leading "./", replace "/" with "-"
        # and collapse "." (e.g. "." -> "root", "./examples" -> "examples",
        # "./components/redis" -> "components-redis").
        profile_name=$(echo "$dir" | sed 's#^\./##; s#/#-#g')
        [ -z "$profile_name" ] || [ "$profile_name" = "." ] && profile_name="root"
        (cd "$dir" && go build ./... && go vet ./... && go test -race -coverprofile="${covdir}/${profile_name}.out" ./...)
      done
  artifacts:
    when: always
    paths:
      - .coverage/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# Aggregate the per-module coverage profiles produced by the `go` job and
# print a human-readable total. This does not gate the pipeline (no coverage
# threshold is enforced yet) but makes coverage visible in the job log and
# exposes the merged profile as an artifact.
coverage:
  stage: test
  image: golang:1.27
  needs:
    - go
  script:
    - |
      set -e
      # Merge all per-module profiles, stripping the per-module mode header so
      # `go tool cover -func` can consume them as one.
      merged=.coverage/merged.out
      : > "$merged"
      for f in .coverage/*.out; do
        [ "$f" = "$merged" ] && continue
        # Drop the leading "mode:" line from every profile except the first.
        if [ -s "$merged" ]; then
          tail -n +2 "$f" >> "$merged"
        else
          cat "$f" > "$merged"
        fi
      done
      echo "== Coverage =="
      go tool cover -func "$merged" | tail -1
  artifacts:
    when: always
    paths:
      - .coverage/merged.out
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# Run staticcheck and gosec on every module. staticcheck is the de-facto Go
# static analyzer (surfaces dead code, simplifications, correctness bugs);
# gosec flags insecure patterns (weak crypto, hardcoded creds, SQL
# injection). Both are installed via `go install` from pinned versions so the
# job is reproducible and needs no pre-baked image.
#
# The lint job is non-blocking (allow_failure: true): the codebase has a number
# of pre-existing findings (deprecated strings.Title/rand.Read, unused fields,
# nil contexts in tests) that are safe but would take a dedicated cleanup pass
# to resolve. Keeping the job non-blocking surfaces findings in every pipeline
# log without gating merges; tighten it to blocking once the backlog is cleared.
lint:
  stage: test
  image: golang:1.27
  allow_failure: true
  cache:
    key:
      files:
        - .gitlab-ci.yml
      prefix: "lint-tools-${STATICCHECK_VERSION}-${GOSEC_VERSION}-go1.27"
    paths:
      - .cache/go/bin
      - .cache/go/pkg/mod
  script:
    - |
      set -e
      export PATH="$GOPATH/bin:$PATH"
      # Install the linters once (cached across runs via .cache/go/bin).
      if ! command -v staticcheck >/dev/null 2>&1; then
        go install "honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}"
      fi
      if ! command -v gosec >/dev/null 2>&1; then
        go install "github.com/securego/gosec/v2/cmd/gosec@${GOSEC_VERSION}"
      fi
      for mod in $(find . -name go.mod -not -path '*/.*' -not -path './hugo-site/*'); do
        dir=$(dirname "$mod")
        echo "== staticcheck $dir =="
        (cd "$dir" && staticcheck ./...)
        echo "== gosec $dir =="
        # gosec excludes the test files (which legitimately use weak patterns
        # like math/rand or fixed test secrets).
        gosec_opts="-exclude-dir=_test"
        # gosec walks the whole tree below the module. From the root module
        # that includes the nested modules (components/, examples/,
        # observability/), which each get their own pass in this loop, plus
        # the CI tool cache (.cache/) and local worktrees (.claude/) — none
        # of which are root-module code. Exclude them from the root pass only;
        # the per-module passes below must keep scanning their own files.
        if [ "$dir" = "." ]; then
          gosec_opts="$gosec_opts -exclude-dir=components -exclude-dir=examples -exclude-dir=observability -exclude-dir=.cache -exclude-dir=.claude"
        fi
        (cd "$dir" && gosec $gosec_opts -severity medium ./...)
      done
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

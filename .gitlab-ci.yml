# Variables for Go CI pipeline.
variables:
  GOPATH: "$CI_PROJECT_DIR/.cache/go"

stages:
  - test
  - deploy

# Build, vet and test every Go module in the repo (core, components/*,
# observability/*, examples). Each directory containing a go.mod is an
# independent module and is validated on its own. A per-module coverage
# profile is written under .coverage/ and aggregated by the coverage job.
go:
  stage: test
  image: golang:1.27
  cache:
    key: go-mod-go1.27
    paths:
      - .cache/go/pkg/mod
  script:
    - |
      set -e
      mkdir -p .coverage
      covdir="$CI_PROJECT_DIR/.coverage"
      for mod in $(find . -name go.mod -not -path '*/.*' -not -path './hugo-site/*'); do
        dir=$(dirname "$mod")
        echo "== $dir =="
        # Build a path-safe profile name: drop leading "./", replace "/" with "-"
        # and collapse "." (e.g. "." -> "root", "./examples" -> "examples",
        # "./components/redis" -> "components-redis").
        profile_name=$(echo "$dir" | sed 's#^\./##; s#/#-#g')
        [ -z "$profile_name" ] || [ "$profile_name" = "." ] && profile_name="root"
        (cd "$dir" && go build ./... && go vet ./... && go test -race -coverprofile="${covdir}/${profile_name}.out" ./...)
      done
  artifacts:
    when: always
    paths:
      - .coverage/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# Aggregate the per-module coverage profiles produced by the `go` job and
# print a human-readable total. This does not gate the pipeline (no coverage
# threshold is enforced yet) but makes coverage visible in the job log and
# exposes the merged profile as an artifact.
coverage:
  stage: test
  image: golang:1.27
  needs:
    - go
  script:
    - |
      set -e
      # Merge all per-module profiles, stripping the per-module mode header so
      # `go tool cover -func` can consume them as one.
      merged=.coverage/merged.out
      : > "$merged"
      for f in .coverage/*.out; do
        [ "$f" = "$merged" ] && continue
        # Drop the leading "mode:" line from every profile except the first.
        if [ -s "$merged" ]; then
          tail -n +2 "$f" >> "$merged"
        else
          cat "$f" > "$merged"
        fi
      done
      echo "== Coverage =="
      go tool cover -func "$merged" | tail -1
  artifacts:
    when: always
    paths:
      - .coverage/merged.out
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# Run staticcheck and gosec on every module. staticcheck is the de-facto Go
# static analyzer (surfaces dead code, simplifications, correctness bugs);
# gosec flags insecure patterns (weak crypto, hardcoded creds, SQL
# injection). Both are installed via `go install` from pinned versions so the
# job is reproducible and needs no pre-baked image.
#
# The lint job is blocking: every module is clean, so a new finding fails the
# pipeline. Fix it, or silence a proven false positive with a justified
# `#nosec <rule> -- reason` / `//lint:ignore <check> reason` comment.
lint:
  stage: test
  image: golang:1.27
  cache:
    key:
      files:
        - .gitlab-ci.yml
        - .tools/lint/go.sum
      prefix: "lint-tools-go1.27"
    paths:
      - .cache/go/bin
      - .cache/go/pkg/mod
  script:
    - |
      set -e
      export PATH="$GOPATH/bin:$PATH"
      # Install the linters once (cached across runs via .cache/go/bin). They
      # are built from .tools/lint/go.mod, which pins the golang.org/x/tools
      # they use to read the compiler's export data. A linter can only read
      # export data written by a Go no newer than its x/tools supports
      # ("export data version 5 is greater than maximum supported version 4"),
      # and the golang:1.27 image floats across patch releases: bump x/tools in
      # .tools/lint when a new Go breaks the linters, and rebuild the cached
      # binaries whenever the Go version changes.
      go_version=$(go env GOVERSION)
      stamp="$GOPATH/bin/.built-with-go"
      if [ "$(cat "$stamp" 2>/dev/null)" != "$go_version" ] ||
        [ ! -x "$GOPATH/bin/staticcheck" ] || [ ! -x "$GOPATH/bin/gosec" ]; then
        (cd .tools/lint && GOWORK=off GOBIN="$GOPATH/bin" go install tool)
        echo "$go_version" > "$stamp"
      fi
      # Lint every module before failing: with set -e the job stopped at the
      # first module with a finding, so the modules after it (including the
      # root module) were never linted in CI.
      has_errors=0
      for mod in $(find . -name go.mod -not -path '*/.*' -not -path './hugo-site/*' | sort); do
        dir=$(dirname "$mod")
        echo "== staticcheck $dir =="
        (cd "$dir" && staticcheck ./...) || has_errors=1
        echo "== gosec $dir =="
        # gosec excludes the test files (which legitimately use weak patterns
        # like math/rand or fixed test secrets).
        gosec_opts="-exclude-dir=_test"
        # gosec walks the whole tree below the module. From the root module
        # that includes the nested modules (components/, examples/,
        # observability/), which each get their own pass in this loop, plus
        # the CI tool cache (.cache/) and local worktrees (.claude/) — none
        # of which are root-module code. Exclude them from the root pass only;
        # the per-module passes below must keep scanning their own files.
        if [ "$dir" = "." ]; then
          gosec_opts="$gosec_opts -exclude-dir=components -exclude-dir=examples -exclude-dir=observability -exclude-dir=.cache -exclude-dir=.claude -exclude-dir=.tools"
        fi
        (cd "$dir" && gosec $gosec_opts -severity medium ./...) || has_errors=1
      done
      if [ "$has_errors" -ne 0 ]; then
        echo "Linter issues detected."
        exit 1
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
